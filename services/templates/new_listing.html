{% extends 'base.html' %}
{% block title %}New listing{% endblock %}
{% block content %}
<div class="container mt-4">
  <h1 class="mb-4 text-primary">Offer or Request Services</h1>

  <!-- Display success/error messages, if any -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info"
        style="white-space: pre-line;">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}

  <!-- New listing Form -->
  <form method="post" class="border p-4 rounded bg-light shadow-sm">
    {% csrf_token %}
    {% include "services/_listing_fields.html" %}
    <button type="submit" class="btn btn-success">Post Listing</button>
  </form>
</div>
{% endblock %}
