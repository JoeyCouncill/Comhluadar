{% extends 'base.html' %}
{% block title %}Edit listing{% endblock %}
{% block content %}
<div class="container mt-4">
  <h1 class="mb-4 text-primary">Edit Listing</h1>
  <!-- Display success/error messages, if any -->
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-info" style="white-space: pre-line;">
        {{ message }}
      </div>
    {% endfor %}
  {% endif %}
  <!-- Edit listing Form -->
  <form method="post" class="border p-4 rounded bg-light shadow-sm" id="edit-listing-form">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ return_url }}">
    {% include "services/_listing_fields.html" %}
    <button type="submit" class="btn btn-success" id="save-listing-button">
    Save Changes
    </button>
    <a href="{{ return_url }}" class="btn btn-outline-secondary" id="cancel-edit-button">
      Cancel
    </a>
  </form>
</div>
{% endblock %}
