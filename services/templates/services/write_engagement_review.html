{% extends "base.html" %}
{% block title %}Write a review{% endblock %}
{% block content %}
<div class="container mt-4">
  <h1 class="h3">Write a review</h1>
  <p class="text-muted">
    {{ engagement.listing.title }} · 
    Reviewing {% include "accounts/_profile_link.html" with person=reviewed_user only %}
  <form method="post"
    action="{% url 'write_engagement_review' engagement.listing_id %}"
  >
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Submit review</button>
    <a href="{% url 'account_summary' %}#engagements-pane"
      class="btn btn-outline-secondary"
    >
      Cancel
    </a>
  </form>
</div>
{% endblock %}
