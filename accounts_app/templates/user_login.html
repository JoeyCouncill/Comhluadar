{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Comhluadar | Log In </title>
    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
  </head>

<div class="container mt-4">
  <h1 class="mb-4 text-primary">Log in to Comhluadar Account</h1>

  <form method="POST" class="border p-4 rounded bg-light shadow-sm">
    {% csrf_token %}

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <div class="mb-3">
      <label for="username" class="form-label">Email or Username</label>
      <input
        type="text"
        id="username"
        name="username"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input
        type="password"
        id="password"
        name="password"
        class="form-control"
        required
      />
    </div>

    <button type="submit" class="btn btn-primary">
      Log In
    </button>
  </form>

  <div class="mt-3">
    <a href="#">Forgot password?</a>
  </div>

  <div class="mt-2">
    Don't have an account?
    <a href="{% url 'create_account' %}">Create Account</a>
  </div>
</div>
