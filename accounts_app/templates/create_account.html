{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Comhluadar | Create Account </title>
    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />
  </head>
<div class="container mt-4">
  <h1 class="mb-4 text-primary">Create User Account</h1>

  <form method="POST" class="border p-4 rounded bg-light shadow-sm">
    {% csrf_token %}

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-info">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">UNO Email</label>
      <input
        type="email"
        id="email"
        name="email"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password1" class="form-label">Password</label>
      <input
        type="password"
        id="password1"
        name="password1"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="password2" class="form-label">Confirm Password</label>
      <input
        type="password"
        id="password2"
        name="password2"
        class="form-control"
        required
      />
    </div>

    <div
      id="password-error"
      class="alert alert-danger"
      style="display: none;"
    >
      Passwords do not match.
    </div>

    <button type="submit" class="btn btn-success">
      Create Account
    </button>
  </form>

  <div class="mt-3">
    Already have an account?
    <a href="{% url 'user_login' %}">Log In</a>
  </div>
</div>

<script>
  const form = document.querySelector("form");
  const password1 = document.getElementById("password1");
  const password2 = document.getElementById("password2");
  const passwordError = document.getElementById("password-error");

  form.addEventListener("submit", function(event) {
    if (password1.value !== password2.value) {
      event.preventDefault();
      passwordError.style.display = "block";
    } else {
      passwordError.style.display = "none";
    }
  });
</script>
